name = "rigcheck-scan-proxy"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Secrets — never put real values here. Set with:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put REVENUECAT_SECRET_KEY

[vars]
REVENUECAT_PROJECT_ID = "proj07f52826"
REVENUECAT_CURRENCY_CODE = "SCAN"
# The internal id (entl...) of the entitlement whose lookup key is `pro` (RevenueCat dashboard, Entitlements).
# The Worker does not read it; scripts/grant_tester.py does, because RevenueCat's grant call wants the id.
REVENUECAT_PRO_ENTITLEMENT_ID = "entl2844545953"
# Public project URL (not a secret); account tokens are verified against its JWKS.
SUPABASE_URL = "https://lifginpapkevreyrzzex.supabase.co"
