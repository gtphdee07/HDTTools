[project]
name = "hdttools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.120.2",
    "easyocr>=1.7.2",
    "fastapi>=0.141.1",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "pyzbar>=0.1.9",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
hdttools = "hdttools:main"

[project.optional-dependencies]
streamlit = [
    "streamlit>=1.61.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/hdttools", "streamlit_app"]
